name: Flatpak

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: eu.jumplink.Learn6502.json
          bundle: eu.jumplink.Learn6502.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
