name: Deploy Pages

# Builds the landing page (`gjsify site build`, static HTML generated from the
# AppStream metainfo by @gjsify/site) and the app-web Adwaita SPA (`gjsify build --app browser`)
# and deploys both to GitHub Pages: the landing page at /Learn6502/, the web app
# at /Learn6502/app/. The successor to the legacy Jekyll build of the classic
# tutorial (removed in the app-web rewrite). Point Settings → Pages → Source at
# "GitHub Actions" for this workflow to serve the site.

on:
  push:
    branches: [main]
    paths:
      - "packages/app-web/**"
      - "packages/learn/**"
      - "packages/common-ui/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "packages/examples/**"
      - "packages/translations/**"
      - "packages/app-gnome/data/metainfo/**"
      - "package.json"
      - "misc/screenshots/**"
      - "docs/legal-notice*.md"
      - "docs/privacy*.md"
      - "gjsify-lock.json"
      - ".github/workflows/deploy-pages.yml"
  # New release assets and download counts change what the landing page shows.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing page and web app
    runs-on: ubuntu-latest
    # `gjsify build`/`gjsify tsc` spawn `gjs` (unavailable on ubuntu-latest), so
    # build in a Fedora 43 container (GJS 1.86 / SpiderMonkey 140) — the same
    # environment as the CI type-check job.
    container:
      image: fedora:43
    steps:
      - name: Install container prerequisites (incl. gjs)
        # json-glib + libsoup3 are dlopened by @gjsify/rolldown-native's typelib
        # since 0.48.0; without them GJS logs a GIRepository warning, the bundler
        # engine fails to load, and the first script that needs it dies with
        # "Unsupported type void". Neither ships in the bare fedora image.
        # The GTK packages are for the LEARN build, not for GTK code. The CLI
        # auto-bundles the by-name `@mdx-js/rollup` plugin, and that bundle is
        # always built with `--globals auto` (`bundlePluginForGjs` passes no
        # globals policy), which since 0.48.0 detects HTMLCanvasElement/document/
        # navigator in the plugin's graph and injects GTK-backed registers — so
        # the bundle demands Pango/Gdk/GdkPixbuf typelibs at import. learn's own
        # `--globals node` does not reach it. This container was deliberately
        # GTK-less; restoring that needs an upstream fix in gjsify.
        run: dnf install -y git tar xz findutils gjs json-glib libsoup3 pango gtk4 gdk-pixbuf2 gdk-pixbuf2-modules-extra glycin-loaders glib2-devel

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A `release` event runs on the tag's commit, which can predate the
          # site; the page must always be built from the default branch.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      - name: Install gjsify CLI
        run: npm install -g @gjsify/cli@0.64.14

      - name: Install dependencies
        run: gjsify install --immutable

      # From here on `gjsify` resolves to the version `gjsify-lock.json` pins,
      # not the globally installed bootstrap copy. Without this the two drift:
      # this workflow ran the bootstrap CLI for every step while the tree
      # resolved a different one, so a green run measured a toolchain nobody
      # develops against. Same step as in issue-to-pr.yml.
      - name: Use the workspace-pinned gjsify CLI
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # The PATH step above is silent when it does not take effect, and a CLI
      # that merely *runs* proves nothing about which one it is. Assert it.
      - name: Assert the CLI is the locked one
        run: |
          set -eu
          locked=$(node -p "require('./node_modules/@gjsify/cli/package.json').version")
          actual=$(gjsify --version)
          echo "gjsify: $(command -v gjsify) -> $actual (lockfile: $locked)"
          [ "$actual" = "$locked" ] || { echo "::error::gjsify $actual != locked $locked"; exit 1; }

      # app-web imports `@learn6502/learn/dist/tutorial.html` (and the examples'
      # `.asm`), so the workspace deps that publish built output must be built
      # first — the same set the CI type-check job builds.
      - name: Build workspace dependencies
        run: |
          gjsify workspace @learn6502/core build
          gjsify workspace @learn6502/examples build
          gjsify workspace @learn6502/learn build

      - name: Build web app
        run: gjsify workspace @learn6502/app-web build:app

      # The release list and download counts come from the GitHub API; the token
      # only lifts the rate limit. A failed lookup warns and the page links to the
      # releases instead of failing the deploy. The output dir mirrors the Pages
      # base path so `/Learn6502/` resolves the same when served locally.
      - name: Build landing page
        run: gjsify site build --out site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The web app is relative-path only (`./app.js`), so it can sit below the
      # landing page without a base change.
      - name: Place the web app below the landing page
        run: |
          mkdir -p site/app
          cp -r packages/app-web/dist-app/. site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
