<?xml version="1.0" encoding="UTF-8"?>
<!--
Achievement draft "first-chapter" — learn6502.
The object is a game cartridge with a label; only the motif changes per achievement. Shared frame across all
three apps: 192 x 96 (2:1), 2 px grid, drawn for raster heights 48 and 96 logical px, with a
locked state that keeps the geometry as a muted silhouette. Title and description come from
gettext and are drawn next to the artwork, never inside it.
No text, no raster, no filters, no baked shadows.
-->
<svg width="192" height="96" viewBox="0 0 192 96" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="6" x2="0" y2="90" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3584e4"/><stop offset="1" stop-color="#1a5fb4"/></linearGradient>
    <linearGradient id="field" x1="0" y1="14" x2="0" y2="82" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dceafd"/></linearGradient>
    <clipPath id="label"><rect x="52" y="14" width="92" height="68" rx="6"/></clipPath>
  </defs>
  <path id="shell-edge" d="M18 6 H174 A10 10 0 0 1 184 16 V80 A10 10 0 0 1 174 90 H18 A10 10 0 0 1 8 80 V16 A10 10 0 0 1 18 6 Z" fill="#103b74"/>
  <path id="shell" d="M19 10 H173 A7 7 0 0 1 180 17 V79 A7 7 0 0 1 173 86 H19 A7 7 0 0 1 12 79 V17 A7 7 0 0 1 19 10 Z" fill="url(#body)"/>
  <rect id="connector" x="16" y="20" width="26" height="56" rx="4" fill="#103b74"/>
  <rect id="pin-1" x="20" y="26" width="18" height="6" rx="3" fill="#84bbfd"/><rect id="pin-2" x="20" y="38" width="18" height="6" rx="3" fill="#84bbfd"/><rect id="pin-3" x="20" y="50" width="18" height="6" rx="3" fill="#84bbfd"/><rect id="pin-4" x="20" y="62" width="18" height="6" rx="3" fill="#84bbfd"/>
  <rect id="ridge-1" x="152" y="24" width="6" height="48" rx="3" fill="#84bbfd"/><rect id="ridge-2" x="162" y="24" width="6" height="48" rx="3" fill="#84bbfd"/><rect id="ridge-3" x="172" y="24" width="6" height="48" rx="3" fill="#84bbfd"/>
  <rect id="label" x="52" y="14" width="92" height="68" rx="6" fill="url(#field)"/>
  <rect id="label-frame" x="56" y="18" width="84" height="60" rx="4" fill="none" stroke="#1a5fb4" stroke-width="4"/>
  <g id="motif" transform="translate(98,48) scale(1.12)"><path d="M0 -6 C-6 -12 -13 -14 -20 -13 V14 C-13 13 -6 14 0 19 C6 14 13 13 20 14 V-13 C13 -14 6 -12 0 -6 Z" fill="#1a5fb4"/><rect x="-3" y="-7" width="6" height="26" fill="#dceafd"/></g>
</svg>
