<?xml version="1.0" encoding="UTF-8"?>
<!--
Achievement draft "supporter" — learn6502.
The object is a game cartridge with a label; only the motif changes per achievement. Shared frame across all
three apps: 192 x 96 (2:1), 2 px grid, drawn for raster heights 48 and 96 logical px, with a
locked state that keeps the geometry as a muted silhouette. Title and description come from
gettext and are drawn next to the artwork, never inside it.
No text, no raster, no filters, no baked shadows.
-->
<svg width="192" height="96" viewBox="0 0 192 96" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="6" x2="0" y2="90" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f9e483"/><stop offset="1" stop-color="#e5a50a"/></linearGradient>
    <linearGradient id="field" x1="0" y1="14" x2="0" y2="82" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#f9e9b8"/></linearGradient>
    <clipPath id="label"><rect x="52" y="14" width="92" height="68" rx="6"/></clipPath>
    <linearGradient id="holo" x1="0" y1="96" x2="192" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#99c1f0"/><stop offset="0.3" stop-color="#dc8add"/><stop offset="0.6" stop-color="#f9f06b"/><stop offset="1" stop-color="#8ff0a4"/></linearGradient>
  </defs>
  <path id="shell-edge" d="M18 6 H174 A10 10 0 0 1 184 16 V80 A10 10 0 0 1 174 90 H18 A10 10 0 0 1 8 80 V16 A10 10 0 0 1 18 6 Z" fill="#63452c"/>
  <path id="shell" d="M19 10 H173 A7 7 0 0 1 180 17 V79 A7 7 0 0 1 173 86 H19 A7 7 0 0 1 12 79 V17 A7 7 0 0 1 19 10 Z" fill="url(#body)"/>
  <rect id="connector" x="16" y="20" width="26" height="56" rx="4" fill="#63452c"/>
  <rect id="pin-1" x="20" y="26" width="18" height="6" rx="3" fill="#fcefa8"/><rect id="pin-2" x="20" y="38" width="18" height="6" rx="3" fill="#fcefa8"/><rect id="pin-3" x="20" y="50" width="18" height="6" rx="3" fill="#fcefa8"/><rect id="pin-4" x="20" y="62" width="18" height="6" rx="3" fill="#fcefa8"/>
  <rect id="ridge-1" x="152" y="24" width="6" height="48" rx="3" fill="#fcefa8"/><rect id="ridge-2" x="162" y="24" width="6" height="48" rx="3" fill="#fcefa8"/><rect id="ridge-3" x="172" y="24" width="6" height="48" rx="3" fill="#fcefa8"/>
  <rect id="label" x="52" y="14" width="92" height="68" rx="6" fill="url(#field)"/>
  <g clip-path="url(#label)"><path id="holo-band" d="M52 82 L86 14 H104 L70 82 Z" fill="url(#holo)"/></g>
  <rect id="label-frame" x="56" y="18" width="84" height="60" rx="4" fill="none" stroke="#63452c" stroke-width="4"/>
  <g id="motif" transform="translate(98,48) scale(1.12)"><path d="M0 18 C-10 9 -20 1 -20 -8 C-20 -14 -15 -18 -9 -18 C-4 -18 -1 -15 0 -12 C1 -15 4 -18 9 -18 C15 -18 20 -14 20 -8 C20 1 10 9 0 18 Z" fill="#63452c"/></g>
  <path d="M46 9 Q47.5 14.5 53 16 Q47.5 17.5 46 23 Q44.5 17.5 39 16 Q44.5 14.5 46 9 Z" fill="#fffdf2"/>
  <path d="M150 78 Q151.3 82.7 156 84 Q151.3 85.3 150 90 Q148.7 85.3 144 84 Q148.7 82.7 150 78 Z" fill="#fffdf2"/>
</svg>
