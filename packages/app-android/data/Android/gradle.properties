# @gjsify/gi-runtime-android carries libnode_gi.so and the GObject-Introspection closure for
# arm64-v8a and x86_64 only, while NativeScript's runtime AAR carries all four ABIs. Without
# this the APK installs on armeabi-v7a and x86 too, where libNativeScript.so is present but
# libnode_gi.so is not — the app then starts and dies in dlopen at the first requireGi, which
# is a worse outcome than not being offered the app on those devices at all.
#
# `abis` is the knob NativeScript itself reads (see @nativescript/android's app/build.gradle,
# where it feeds defaultConfig.ndk.abiFilters). Setting abiFilters from app.gradle does not
# work: that block overwrites it unconditionally.
abis=arm64-v8a,x86_64
