// You can add your native dependencies here
dependencies {
  // No com.google.android.material: the UI is native Adwaita widgets
  // (@gjsify/adwaita-nativescript) on plain AppCompat/framework views.
  // AndroidX Activity is required by NativeScript for OnBackPressedDispatcher
  implementation 'androidx.activity:activity:1.9.3'
}

android {
  compileSdkVersion 35
  buildToolsVersion "35"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35

    // From package.json, which build-aux/check-versions.js keeps equal to every
    // other copy. A hardcoded pair here shipped APKs labelled 1.0.0 / code 1.
    // versionCode must only grow: major*10000 + minor*100 + patch.
    def pkg = new groovy.json.JsonSlurper().parse(file("$USER_PROJECT_ROOT/package.json"))
    def (major, minor, patch) = pkg.version.tokenize('.-')[0..2]*.toInteger()
    versionCode major * 10000 + minor * 100 + patch
    versionName pkg.version

    generatedDensities = []
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
